---
layout: default
---
<article class="page-shell article-shell">
  <a class="back-link" href="{{ '/portfolio/' | relative_url }}">← Portfolio</a>
  <header class="article-header">
    <p class="eyebrow">{{ page.type | default: 'Project' }}</p>
    <h1>{{ page.title }}</h1>
    <p class="lede">{{ page.description }}</p>
    <div class="chip-row">
      {% for tech in page.tech %}<span class="chip">{{ tech }}</span>{% endfor %}
    </div>
  </header>
  <div class="prose">{{ content }}</div>
</article>
